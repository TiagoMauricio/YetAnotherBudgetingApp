services:
  pexa:
    image: pexa:latest
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on:
      - pexa
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
